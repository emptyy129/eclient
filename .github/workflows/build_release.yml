# Empty Client — автоматическая сборка релизов
# При push тега v* (например v1.0.0) собирает Windows и Linux версии
# и публикует их в GitHub Releases.
#
# Перед использованием:
#   1. Создайте репозиторий yourusername/eclient на GitHub
#   2. Запушьте туда исходный код этого проекта
#   3. Создайте тег: git tag v1.0.0 && git push origin v1.0.0
#   4. GitHub Actions соберёт и опубликует релиз автоматически

name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install vcpkg
      uses: lucakuhn/vcpkg-action@v1
      with:
        pkgs: sdl2 openssl freetype opus opusfile libpng zlib sqlite3
        triplet: x64-windows

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DAUTOUPDATE=ON -DVIDEORECORDER=OFF -DSTEAM=OFF `
          -DDISCORD=OFF -DANTIBOT=OFF -DVULKAN=OFF -DTESTS=OFF

    - name: Build
      run: cmake --build build --config Release --target game-client EClientLauncher

    - name: Package
      run: |
        mkdir release
        mkdir release\EClient
        copy build\Release\EClient.exe release\EClient\
        copy build\Release\EClientLauncher.exe release\EClient\
        xcopy data release\EClient\data\ /E /I /Y /Q
        copy storage.cfg release\EClient\
        mkdir release\EClient\demos
        powershell Compress-Archive -Path release\EClient\* -DestinationPath release\EClient-${{ github.ref_name }}-windows-x86_64.zip

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: release/EClient-${{ github.ref_name }}-windows-x86_64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake g++ git libsdl2-dev libfreetype-dev \
          libsqlite3-dev libpng-dev libopus-dev libogg-dev \
          libcurl4-openssl-dev libssl-dev zlib1g-dev

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Configure & Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DAUTOUPDATE=ON -DVIDEORECORDER=OFF -DSTEAM=OFF \
          -DDISCORD=OFF -DANTIBOT=OFF -DVULKAN=OFF -DTESTS=OFF
        cmake --build build --target game-client EClientLauncher -- -j$(nproc)

    - name: Package
      run: |
        mkdir -p release/EClient
        cp build/game-client release/EClient/EClient
        cp build/EClientLauncher release/EClient/ 2>/dev/null || true
        cp -r data release/EClient/
        cp storage.cfg release/EClient/
        mkdir -p release/EClient/demos
        cd release
        tar -czf EClient-${{ github.ref_name }}-linux-x86_64.tar.gz EClient/

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: release/EClient-${{ github.ref_name }}-linux-x86_64.tar.gz
